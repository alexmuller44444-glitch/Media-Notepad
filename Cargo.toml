[package]
name = "media-notepad"
version = "1.0.0"
description = "A lightweight notepad with inline images, video and audio"
authors = ["Media Notepad"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "media_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.17"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
